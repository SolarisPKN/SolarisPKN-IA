name: Public Blueprint CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Tests
        run: npm test
      - name: Public sanitization audit
        run: npm run audit:public
      - name: Reviewed release manifest (SHA-256 and scope)
        run: npm run audit:release
